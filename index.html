<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Neon Drift: Last Light - Play the game online.">
    <title>Neon Drift: Last Light</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #000000;
            --accent: #ff4fa3;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #pyconsole {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        #terminal {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            margin: auto;
            outline: none;
        }
    </style>

    <!-- Pygame-web скрипт без аудио модула, за да няма блокиране от браузъра -->
    <script
        src="https://pygame-web.github.io/cdn/0.9.3/pythons.js"
        type="module"
        id="site"
        data-python="python3.12"
        data-os="vtx,gui"
        data-main="__main__.py"
        data-LINES="42"
        data-COLUMNS="132">
    </script>
</head>
<body>

    <div id="pyconsole">
        <div id="terminal" tabindex="1"></div>
    </div>

    <script>
        async function custom_onload(debug_hidden) {
            console.log("custom_onload: Neon Drift initialized");
        }

        function custom_prerun() {
            console.log("custom_prerun");
        }

        function custom_postrun() {
            console.log("custom_postrun");
        }
    </script>
</body>
</html>
