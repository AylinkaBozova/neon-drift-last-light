<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Neon Drift: Last Light - Play the game online.">
    <title>Neon Drift: Last Light</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #000000;
            --accent: #ff4fa3;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow: hidden;
        }

        #infobox,
        #info,
        #terminal,
        #pyconsole {
            background-color: #000000;
            color: #ffffff;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 8px 12px;
        }

        button:hover,
        button:focus {
            outline: none;
            border-color: #ff80bd;
            box-shadow: 0 0 10px #ff4fa366;
        }

        #load_rst {
            color: #ffffff;
        }

        canvas {
            outline-color: var(--accent);
        }
    </style>

    <script
        src="https://pygame-web.github.io/cdn/0.9.3/pythons.js"
        type="module"
        id="site"
        data-python="python3.12"
        data-LINES="42"
        data-COLUMNS="132">
    </script>
</head>
<body>

    <div id="system" hidden>
        <div class="button-container">
            <div id="load_min">min</div>
            <div id="load_avg">avg</div>
            <div id="load_max">max</div>
            <button id="load_rst" disabled>RESET</button>
        </div>

        <div id="level">(battery level unknown)</div>
        <div id="stateBattery">(charging state unknown)</div>
    </div>

    <div id="box" class="emscripten_border" hidden>
        <div id="info" class="trinfo"></div>

        <iframe
            id="iframe"
            class="framed"
            name="iframe"
            width="470px"
            height="90%"
            allowtransparency="true"
            style="z-index: 10; background: #000000;"
            frameborder="1"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            msallowfullscreen="true"
            mozallowfullscreen="true"
            sandbox="allow-same-origin allow-top-navigation allow-scripts allow-pointer-lock"
            allow="autoplay; fullscreen *; gamepad"
            src="https://pygame-web.github.io/cdn/0.9.3/empty.html"
            scrolling="yes">
        </iframe>
    </div>

    <div id="dlg" hidden>
        <input type="file" id="dlg_multifile" multiple accept="image/*">
        <label for="dlg_multifile">Select files</label>
    </div>

    <div id="pyconsole">
        <div id="terminal" tabindex="1" align="left"></div>
    </div>

    <script>
        globalThis.__canvas_resized = (self, ecw, ech) => {
            console.warn("TODO: panda3d canvas monitor", self, ecw, ech);
        };

        async function custom_onload(debug_hidden) {
            console.log("custom_onload");

            const pyconsole = document.getElementById("pyconsole");
            const system = document.getElementById("system");
            const info = document.getElementById("info");
            const box = document.getElementById("box");

            if (pyconsole) pyconsole.hidden = debug_hidden;
            if (system) system.hidden = debug_hidden;
            if (info) info.hidden = debug_hidden;
            if (box) box.hidden = debug_hidden;

            document.body.style.background = "#000000";
            document.body.style.color = "#ffffff";

            if (typeof show_infobox === "function") {
                show_infobox();
            }
        }

        function custom_prerun() {
            console.log("custom_prerun");
        }

        function custom_postrun() {
            console.log("custom_postrun");
        }

        function debug() {
            if (typeof python !== "undefined" && python.config) {
                python.config.debug = true;
            }

            custom_onload(false);

            if (typeof Module !== "undefined" &&
                typeof Module.PyRun_SimpleString === "function") {
                Module.PyRun_SimpleString("shell.uptime()");
            }

            if (typeof window_resize === "function") {
                window_resize();
            }
        }

        function info_inline(data) {
            document.getElementById("info").innerHTML = data;
        }

        function info_online(url) {
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to load: " + response.status);
                    }
                    return response.text();
                })
                .then(html => info_inline(html))
                .catch(error => console.warn(error));
        }

        function frame_online(url) {
            window.frames["iframe"].location = url;
        }
    </script>
</body>
</html>
