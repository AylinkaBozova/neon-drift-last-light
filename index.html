<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Drift: Last Light</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
        }
        #pyconsole {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        #terminal {
            display: none;
        }
        canvas {
            display: block;
            margin: auto;
            outline: none;
        }
    </style>
    <!-- Зареждане на pythons.js с насочване към main.py -->
    <script
        src="https://pygame-web.github.io/cdn/0.9.3/pythons.js"
        type="module"
        id="site"
        data-python="python3.12"
        data-os="vtx,gui"
        data-main="main.py"
        data-LINES="42"
        data-COLUMNS="132">
    </script>
</head>
<body>
    <div id="pyconsole">
        <div id="terminal" tabindex="1"></div>
    </div>
</body>
</html>
